<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakil Style Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#000; --paper:#fff; --mute:#666; --line:#000; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans',Arial,sans-serif; background:var(--paper); color:var(--ink); line-height:1.5; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }

  header { border-bottom:1px solid var(--line); }
  header .wrap { display:flex; justify-content:space-between; align-items:center; height:64px; }
  .logo { font-weight:800; font-size:20px; }
  .cart-btn { background:none; border:1px solid var(--line); padding:8px 14px; font-weight:600; }
  .cart-btn:hover { background:var(--ink); color:var(--paper); }

  .hero { padding:56px 0 32px; }
  .hero h1 { font-size:clamp(32px,6vw,56px); font-weight:800; line-height:1.1; }
  .hero p { color:var(--mute); margin-top:8px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:28px; padding:16px 0 64px; }
  .card { cursor:pointer; }
  .card img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:#eee; border:1px solid var(--line); }
  .card h3 { font-size:15px; font-weight:600; margin-top:10px; }
  .card .price { font-weight:800; }

  .btn { display:block; width:100%; background:var(--ink); color:var(--paper); border:1px solid var(--ink); padding:12px; font-weight:600; text-align:center; text-decoration:none; }
  .btn:hover { background:var(--paper); color:var(--ink); }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:10; }
  .overlay.open { display:flex; }
  #detailsModal { align-items:center; justify-content:center; padding:16px; }
  .dialog { background:var(--paper); max-width:440px; width:100%; max-height:100%; overflow-y:auto; border:1px solid var(--line); }
  .dialog img { width:100%; max-height:340px; object-fit:cover; display:block; }
  .dialog .body { padding:20px; display:grid; gap:14px; }
  .dialog h2 { font-size:20px; }
  .dialog p { color:var(--mute); font-size:14px; }
  .sizes { display:flex; gap:10px; }
  .sizes button { flex:1; background:var(--paper); border:1px solid var(--line); padding:10px; font-weight:600; }
  .sizes button.active { background:var(--ink); color:var(--paper); }
  .close { background:none; border:none; font-size:24px; line-height:1; padding:4px 8px; }

  #cartModal { justify-content:flex-end; }
  .drawer { background:var(--paper); width:100%; max-width:400px; height:100%; display:flex; flex-direction:column; }
  .drawer-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); font-weight:800; }
  #cart-items { flex:1; overflow-y:auto; padding:16px 20px; display:grid; gap:14px; align-content:start; }
  .empty { color:var(--mute); }
  .item { display:flex; gap:12px; font-size:14px; }
  .item img { width:56px; height:70px; object-fit:cover; border:1px solid var(--line); }
  .item .info { flex:1; }
  .item .info b { display:block; }
  .qty { display:inline-flex; align-items:center; border:1px solid var(--line); margin-top:4px; }
  .qty button { background:none; border:none; width:26px; height:26px; }
  .qty span { min-width:24px; text-align:center; }
  .remove { background:none; border:none; color:var(--mute); text-decoration:underline; font-size:12px; align-self:flex-start; }
  .drawer-foot { border-top:1px solid var(--line); padding:16px 20px; display:grid; gap:10px; }
  .total { display:flex; justify-content:space-between; font-weight:800; font-size:18px; }
  .drawer-foot input, .drawer-foot textarea { width:100%; border:1px solid var(--line); background:var(--paper); padding:10px; font-size:14px; resize:none; }
  .note { font-size:12px; color:var(--mute); text-align:center; }

  .wa { position:fixed; right:20px; bottom:20px; background:var(--ink); color:var(--paper); border:2px solid var(--paper); padding:12px 18px; font-weight:600; text-decoration:none; z-index:5; }
  .wa:hover { background:var(--paper); color:var(--ink); border-color:var(--ink); }

  footer { border-top:1px solid var(--line); padding:28px 0; text-align:center; font-size:13px; color:var(--mute); }
  footer b { color:var(--ink); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">Sakil Style Hub</div>
    <button class="cart-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
  </div>
</header>

<section class="hero wrap">
  <h1>Half-sleeve t-shirts<br>from 369৳</h1>
  <p>Cash on delivery across Bangladesh.</p>
</section>

<main class="wrap">
  <div id="product-grid" class="grid"></div>
</main>

<a class="wa" target="_blank" rel="noopener" href="https://wa.me/8801321543071?text=Hello%20Sakil%20Style%20Hub,%20I%20have%20a%20question%20about%20your%20t-shirts.">WhatsApp</a>

<div id="detailsModal" class="overlay" onclick="if(event.target===this)closeDetails()">
  <div class="dialog">
    <img id="modal-img" src="" alt="">
    <div class="body">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <h2 id="modal-title"></h2>
        <button class="close" onclick="closeDetails()" aria-label="Close">&times;</button>
      </div>
      <p id="modal-desc"></p>
      <b id="modal-price"></b>
      <div class="sizes" id="modal-sizes">
        <button onclick="selectSize('M')">M</button>
        <button onclick="selectSize('L')">L</button>
        <button onclick="selectSize('XL')">XL</button>
      </div>
      <button class="btn" onclick="addToCart()">Add to cart</button>
    </div>
  </div>
</div>

<div id="cartModal" class="overlay" onclick="if(event.target===this)closeCart()">
  <div class="drawer">
    <div class="drawer-head">
      <span>Your cart</span>
      <button class="close" onclick="closeCart()" aria-label="Close">&times;</button>
    </div>
    <div id="cart-items"></div>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><span id="cart-total">0৳</span></div>
      <input type="text" id="cust-name" placeholder="Full name">
      <input type="tel" id="cust-phone" placeholder="Phone number">
      <textarea id="cust-address" rows="2" placeholder="Delivery address"></textarea>
      <button class="btn" onclick="checkout()">Order on WhatsApp</button>
      <p class="note">Cash on delivery available.</p>
    </div>
  </div>
</div>

<footer>
  <b>Sakil Style Hub</b><br>Fast delivery
</footer>

<script>
  const WA_NUMBER = "8801321543071";
  const BASE = "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/";

  const products = [
    { id:1, title:"Off White Premium Check Shirt", price:399, img:BASE+"0f2698ce8f99ab18513cc693e90bce16.jpg", desc:"Premium organic cotton shirt with stylized chest graphics for a vibrant street look." },
    { id:2, title:"Premium Off White Shirt", price:789, img:BASE+"file_00000000ba208207bf5fbf1462df54d6.png", desc:"Retro-styled vintage automotive graphic on heavy-weight acid wash cotton." },
    { id:3, title:"Sporty Piping Black Tee", price:369, img:BASE+"257d870e812c1b8156c506898c899b22.jpg", desc:"Sleek black crew neck with a breathable knit blend and modern silhouette." },
    { id:4, title:"Minimalist Beige Casual Tee", price:369, img:BASE+"10d6b78f568b14dc0c249abb68b196f7.jpg", desc:"Soft earth-tone beige half-sleeve top for daily casual wear." },
    { id:5, title:"Worldwide Acid Wash Streetwear Tee", price:369, img:BASE+"0844444531791d41868e9e9e29e79b43.jpg", desc:"Bold typography on relaxed-fit washed cotton. Designed for urban comfort." },
    { id:6, title:"Classic Earth Brown Polo Tee", price:369, img:BASE+"f16854a84c1cf1abedeccc6d6e576078.jpg", desc:"Tailored brown polo-style t-shirt with ribbed collar and comfortable stretch." },
    { id:7, title:"Premium Brown Polo Shirt", price:789, img:BASE+"file_00000000118882118fb98454cd248639.png", desc:"Retro-styled vintage automotive graphic on heavy-weight acid wash cotton." }
  ];

  let cart = [];
  let size = 'M';
  let current = null;
  const $ = id => document.getElementById(id);

  function renderProducts() {
    $('product-grid').innerHTML = products.map(p => `
      <div class="card" onclick="openDetails(${p.id})">
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        <h3>${p.title}</h3>
        <div class="price">${p.price}৳</div>
      </div>`).join('');
  }

  function openDetails(id) {
    current = products.find(p => p.id === id);
    $('modal-img').src = current.img;
    $('modal-img').alt = current.title;
    $('modal-title').textContent = current.title;
    $('modal-desc').textContent = current.desc;
    $('modal-price').textContent = current.price + '৳';
    selectSize('M');
    $('detailsModal').classList.add('open');
  }
  function closeDetails() { $('detailsModal').classList.remove('open'); }

  function selectSize(s) {
    size = s;
    document.querySelectorAll('#modal-sizes button').forEach(b => b.classList.toggle('active', b.textContent === s));
  }

  function addToCart() {
    const found = cart.find(i => i.id === current.id && i.size === size);
    if (found) found.qty++;
    else cart.push({ id:current.id, title:current.title, price:current.price, img:current.img, size, qty:1 });
    closeDetails();
    updateCart();
    openCart();
  }

  function changeQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) cart.splice(index, 1);
    updateCart();
  }
  function removeItem(index) { cart.splice(index, 1); updateCart(); }

  function updateCart() {
    $('cart-count').textContent = cart.reduce((n, i) => n + i.qty, 0);
    $('cart-total').textContent = cart.reduce((n, i) => n + i.price * i.qty, 0) + '৳';
    $('cart-items').innerHTML = cart.length ? cart.map((i, idx) => `
      <div class="item">
        <img src="${i.img}" alt="">
        <div class="info">
          <b>${i.title}</b>
          Size ${i.size} · ${i.price}৳
          <div class="qty">
            <button onclick="changeQty(${idx},-1)" aria-label="Decrease">−</button>
            <span>${i.qty}</span>
            <button onclick="changeQty(${idx},1)" aria-label="Increase">+</button>
          </div>
        </div>
        <button class="remove" onclick="removeItem(${idx})">Remove</button>
      </div>`).join('') : '<p class="empty">Your cart is empty. Pick a t-shirt to get started.</p>';
  }

  function openCart() { $('cartModal').classList.add('open'); }
  function closeCart() { $('cartModal').classList.remove('open'); }

  function checkout() {
    if (!cart.length) return alert('Your cart is empty. Add a t-shirt first.');
    const name = $('cust-name').value.trim();
    const phone = $('cust-phone').value.trim();
    const address = $('cust-address').value.trim();
    if (!name || !phone || !address) return alert('Enter your name, phone number and address.');

    const lines = cart.map(i => `- ${i.title} (Size ${i.size}) x${i.qty} = ${i.price * i.qty}৳`).join('\n');
    const total = cart.reduce((n, i) => n + i.price * i.qty, 0);
    const msg = `New order from Sakil Style Hub\n\n${lines}\n\nTotal: ${total}৳\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetails(); closeCart(); } });
  renderProducts();
  updateCart();
</script>
</body>
</html>
